name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # temporary: the 80 % gate in pyproject applies again once the test-writing tasks land (Task 9 removes this flag)
      - run: uv run pytest -q --cov --cov-report=xml --cov-report=term --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: launchsite
          POSTGRES_USER: launchsite
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U launchsite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: launchsite
      POSTGRES_USER: launchsite
      POSTGRES_PASSWORD: changeme
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: PGPASSWORD=changeme psql -v ON_ERROR_STOP=1 -h localhost -U launchsite -d launchsite -f infra/postgres-init/001_schema.sql
      - run: uv run pytest -q -m api || [ $? -eq 5 ]
