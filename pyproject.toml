[project]
name = "launchsite-osint"
version = "0.2.0"
description = "Satellite-based launch site detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.4",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "pytorch-lightning>=2.2",
    "segmentation-models-pytorch>=0.3.3",
    "torchmetrics>=1.3",
    "mlflow>=2.10",
    "prefect>=3.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "scipy>=1.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "pillow>=10",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]
triton = [
    "tritonclient[grpc]>=2.42",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "pynvml>=11.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["libs*", "services*", "benchmarks*"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "integration: synthetic end-to-end run on CPU (~1-2 min)",
    "api: needs a PostGIS database (DATABASE_URL)",
    "slow: skipped unless --run-slow",
]
addopts = "-m 'not api' --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:torch.*", "ignore::UserWarning:pytorch_lightning.*"]

[tool.coverage.run]
source = ["libs", "services"]
omit = ["services/web/*", "services/pipeline/flows.py", "services/serving/export_model.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["services/web", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
